# Copy to igtool.ini and fill in. igtool.ini is ignored by git.
[igtool]
# Long-lived user access token with instagram_basic / instagram_business_basic,
# instagram_content_publish / instagram_business_content_publish and
# instagram_manage_insights / instagram_business_manage_insights.
access_token =

# Instagram professional account id. Find it with: python -m igtool whoami
# Optional when api_host is graph.instagram.com (the token already identifies it).
ig_user_id =

# graph.facebook.com  -> "Instagram API with Facebook Login" (account linked to a Facebook Page)
# graph.instagram.com -> "Instagram API with Instagram Login" (no Page needed)
api_host = graph.facebook.com
api_version = v26.0

# Where the post queue lives and where reports are written.
database = igtool.db
report_dir = reports

# Default zone for "schedule add --at".
timezone = UTC

# Metric names can be adjusted if Meta renames them again (comma separated).
# account_series_metrics = reach, follower_count
# account_total_metrics = views, reach, accounts_engaged, total_interactions, likes, comments, shares, saves, replies, profile_views, website_clicks, follows_and_unfollows
# media_metrics_feed = views, reach, likes, comments, shares, saved, total_interactions, follows, profile_visits
# media_metrics_reels = views, reach, likes, comments, shares, saved, total_interactions, ig_reels_avg_watch_time, ig_reels_video_view_total_time
# media_metrics_story = views, reach, replies, shares, total_interactions, follows, profile_visits
